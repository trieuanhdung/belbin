name: Verify live RGSV network labs
on:
  push:
    branches: [publish-rgsv-network-labs-20260923]
    paths: [.github/workflows/verify-rgsv-network-labs.yml]
permissions:
  contents: read
jobs:
  verify-live-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check each published page and verify its exact contents
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          base = 'https://trieuanhdung.github.io/belbin/network-labs/'
          for name in ['index.html', 'lab-01.html', 'lab-02.html', 'lab-03.html']:
              url = base + ('' if name == 'index.html' else name)
              expected = hashlib.sha256((Path('network-labs') / name).read_bytes()).hexdigest()
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'RGSV-Network-Labs-Deployment-Check', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          data = response.read()
                          status = response.status
                          actual_url = response.url
                      actual = hashlib.sha256(data).hexdigest()
                      assert status == 200, 'Expected HTTP 200'
                      assert actual == expected, 'Published page is not yet the expected version'
                      print('PASS', status, actual_url, len(data), 'bytes; SHA-256', actual, flush=True)
                      break
                  except Exception as error:
                      if attempt == 11:
                          raise
                      print('Waiting for deployment:', url, str(error), flush=True)
                      time.sleep(10)
          print('PASS: the hub and all three live lab pages exactly match the approved files.')
          PY
