name: Verify live Lab 04
on:
  push:
    branches: [publish-lab04-go-20260925]
    paths: ['.github/workflows/verify-lab04-live.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify live HTML against the prepared source files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          base = 'https://trieuanhdung.github.io/belbin/network-labs/'
          for name in ['index.html','lab-01.html','lab-02.html','lab-03.html','lab-04.html']:
              expected = hashlib.sha256((Path('network-labs')/name).read_bytes()).hexdigest()
              url = base+('' if name=='index.html' else name)
              for attempt in range(24):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent':'RGSV-Lab04-Verify','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          data=response.read()
                          assert response.status==200
                      assert hashlib.sha256(data).hexdigest()==expected, 'Deployment not updated yet'
                      if name=='index.html':
                          assert b'href="lab-04.html"' in data
                      if name=='lab-04.html':
                          assert b'function go()' in data and b'start(true,true)' in data
                      print('PASS HTTP 200',url,len(data),'bytes; SHA-256',expected,flush=True)
                      break
                  except Exception as e:
                      if attempt==23: raise
                      print('Waiting:',url,str(e),flush=True)
                      time.sleep(5)
          print('PASS: the live hub and all four labs match their expected versions.',flush=True)
          PY
