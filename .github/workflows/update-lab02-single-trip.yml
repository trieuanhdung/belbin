name: Prepare Lab 02 single-round-trip update
on:
  push:
    branches: [update-lab02-one-round-trip-20260925]
    paths: [.github/workflows/update-lab02-single-trip.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the exact browser-tested change set
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib, json, hashlib, re
          from pathlib import Path
          path = Path('network-labs/lab-02.html')
          original = path.read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'eaad815aca8be925460fb2066d42e2718a961945b7f608e466167e7333ae6bf6', 'Lab 02 changed; refusing to overwrite'
          encoded = ''
          ops = json.loads(zlib.decompress(base64.b64decode(encoded)))
          lines = original.decode('utf-8').splitlines(keepends=True)
          for op in reversed(ops):
              lines[op['start']:op['end']] = [op['text']]
          result = ''.join(lines).encode('utf-8')
          assert hashlib.sha256(result).hexdigest() == '9655145339aaf38d2cd07bf952cf3efcb9ed5d4ba8857b59779f8c1b3d19f731', 'Output checksum mismatch'
          path.write_bytes(result)
          script = re.search(r'<script>([\s\S]*?)</script>', result.decode('utf-8')).group(1)
          Path('/tmp/lab02.js').write_text(script)
          print('Verified Lab 02:', len(result), 'bytes')
          PY
          node --check /tmp/lab02.js
      - name: Commit updated HTML on the preparation branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add network-labs/lab-02.html
          git commit -m 'Build exact Lab 02 v3 with one broadcast and one IP reply'
          git push origin HEAD:update-lab02-one-round-trip-20260925
