/* Lab 03 v2 · node-anchored process windows. These are magnified process views,
   not extra devices: the standalone network artwork stays unchanged. */
body.closeup-mode:not(.tools-open) .workspace{grid-template-columns:minmax(0,1fr) 0}

.closeup-tools{white-space:nowrap}
.process-step .step-copy small{font-size:8px}
.process-separator{width:18px}
.packetizer-scene,.buffer-preview{display:none!important}
#process-windows{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
#process-connectors{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#process-connectors path{fill:none;stroke-width:1.7;stroke-dasharray:5 4}
#process-connectors text{font:700 10px var(--mono);text-anchor:middle;dominant-baseline:middle;fill:white}
.process-window{position:absolute;width:390px;border:1px solid #dbc697;border-top:3px solid #c5a159;border-radius:14px;background:#fff;box-shadow:0 13px 36px #12284522,0 2px 6px #14233c0c;pointer-events:auto;overflow:hidden;will-change:left,top;max-height:calc(100% - 16px);display:flex;flex-direction:column;color:var(--ink);isolation:isolate}
.process-window.receiver{border-color:#b1d5c8;border-top-color:#418e7d}
.process-window.large{width:510px}
.process-window.compact{width:270px}
.process-window:focus-within{box-shadow:0 12px 32px #1228452c,0 0 0 2px #ceab6328}
.pw-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fcfaf5;border-bottom:1px solid #ece7db;cursor:grab;touch-action:none;user-select:none;flex:none}
.receiver .pw-head{background:#f4faf7;border-color:#e0eee7}
.pw-head:active{cursor:grabbing}
.pw-head .pw-device{height:32px;width:38px;flex:none;pointer-events:none}
.pw-head .pw-device>svg{width:100%;height:100%}
.pw-identity{flex:1;min-width:0}
.pw-role{display:block;font:700 9px var(--font);letter-spacing:1.3px;color:#977335;margin-bottom:3px}
.receiver .pw-role{color:#368775}
.pw-identity strong{font-size:13px;color:var(--navy);font-weight:700;margin-right:7px}
.pw-identity code{font:10px var(--mono);color:#7c8ea2;white-space:nowrap}
.pw-actions{display:flex;gap:3px;flex:none}
.pw-actions button{width:25px;height:27px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:4px;color:#687d92;font-size:17px;padding:2px}
.pw-actions button:hover{background:#fff;border-color:#e2e8ef}
.pw-actions button .icon{width:14px;height:14px}
.pw-content{padding:11px 14px 9px;overflow:auto;min-height:0;scrollbar-width:thin;overscroll-behavior:contain}
.pw-phase-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.pw-phase{font:700 11px var(--font);letter-spacing:.3px;color:#86632e}
.receiver .pw-phase{color:#267c6e}
.pw-tally{font:600 10px var(--mono);color:#536c83;white-space:nowrap}
.pw-file-meta{font:11px var(--mono);color:#6e8196;line-height:1.5;overflow-wrap:anywhere;min-height:17px}
.pw-file-meta b{font-weight:600;color:#365777}

.pw-stage text{font-family:var(--font)}
.pw-stage .viz-small{font-size:9px;fill:#8699ac}
.pw-stage .viz-label{font-size:10px;font-weight:650;fill:#566e88;letter-spacing:.45px}
.pw-stage .viz-strong{font-size:12px;font-weight:700;fill:#294f6b}
.pw-stage .viz-mono{font-family:var(--mono);font-size:10px;fill:#537089}
.pw-stage .viz-slot{fill:#fcfdff;stroke:#e2e9f1;stroke-width:1;stroke-dasharray:3 2}
.pw-stage .viz-slot-num{font-family:var(--mono);font-size:9px;fill:#bdc9d7;text-anchor:middle}
.pw-stage .viz-tile{cursor:pointer}
.pw-stage .viz-tile .tile-body{stroke-width:1.15}
.pw-stage .viz-tile .tile-number{font-family:var(--mono);font-size:12px;font-weight:700;fill:#345977;text-anchor:middle}
.pw-stage .viz-tile .tile-header{stroke-width:0}
.pw-stage .viz-tile:focus{outline:none}
.pw-stage .viz-tile:focus .tile-body{stroke:#10254b;stroke-width:2}
.pw-page{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:9px;min-height:27px;color:#8193a7;margin-top:3px}
.pw-page-controls{display:flex;align-items:center;gap:3px;flex:none}
.pw-page button{border:1px solid #e1e7ef;border-radius:4px;min-width:23px;min-height:22px;background:#fff;color:#6c8198;padding:2px 5px;font-size:10px}
.pw-page button.following{color:#956e2d;background:#fcf6e9;border-color:#e2cfab}
.receiver .pw-page button.following{color:#267c6e;background:#eff8f4;border-color:#c8e1d6}
.pw-explanation{margin-top:6px;min-height:30px;font-size:10px;line-height:1.55;color:#627c94}
.pw-progress{height:4px;border-radius:4px;background:#f1f3f7;overflow:hidden;margin-top:7px}
.pw-progress>i{display:block;height:100%;width:0;background:#ceab63}
.receiver .pw-progress>i{background:#479b85}
.pw-footer{display:flex;align-items:center;gap:7px;padding:8px 12px;border-top:1px solid #e9eef4;background:#fbfcfe;flex:none}
.pw-footer .btn{font-size:10px;min-height:27px;padding:4px 7px}
.pw-footer small{margin-left:auto;color:#99a6b5;font-size:8px;line-height:1.4;text-align:right}
.pw-footer .icon{width:12px;height:12px}
.pw-collapse-summary{display:none;padding:8px 12px;background:#fff;align-items:center;gap:7px;min-height:32px}
.pw-collapse-summary>svg{height:27px;width:23px;flex:none}
.pw-collapse-summary span{font-size:10px;line-height:1.45;color:#758ba0}
.pw-collapse-summary strong{font-size:10px;color:#3c695c;font-weight:600}
.process-window.compact .pw-content,.process-window.compact .pw-footer{display:none}
.process-window.compact .pw-collapse-summary{display:flex}
.process-window.compact .pw-head{padding:8px 10px}
.process-window.compact .pw-head .pw-device{height:27px;width:32px}
.process-window.compact .pw-identity strong{font-size:11px}
.process-window.compact .pw-identity code{font-size:9px}
.process-window.compact .pw-actions [data-viz-action="size"]{display:none}
.disk-location{font:10px var(--mono);padding:9px 10px;background:#f1f8f5;border:1px solid #d7e9e0;border-radius:6px;overflow-wrap:anywhere;color:#3c816e;margin-top:8px;line-height:1.7}
.inbox-item small{overflow-wrap:anywhere}

// not use the teaching packet sequence number to choose a route.
const routeCache=new Map();
function routeCandidates(source,dest){
 const key=source.id+'>'+dest.id;if(routeCache.has(key))return routeCache.get(key).map(x=>[...x]);
 if(source.lan===dest.lan)return[[source.id,source.switch,dest.id]];
 const neighbours=id=>LINKS.filter(l=>l.a===id||l.b===id).map(l=>l.a===id?l.b:l.a).filter(id=>getNode(id).type==='router');
 const candidates=[];let visits=0;
 function walk(path,cost){if(++visits>20000)return;const last=path.at(-1);if(last===dest.router){candidates.push({path:[...path],cost});return;}if(path.length>=8)return;for(const next of neighbours(last)){if(path.includes(next))continue;walk([...path,next],cost+getLink(last,next).latency+.2);}}
 walk([source.router],0);candidates.sort((a,b)=>a.cost-b.cost);
 if(!candidates.length)return[];
 const picked=[candidates[0]], edgeSet=p=>new Set(p.slice(1).map((v,i)=>[p[i],v].sort().join('|')));
 while(picked.length<3){let best=null,bestScore=Infinity;for(const c of candidates){if(picked.includes(c)||c.cost>candidates[0].cost*2.35+1)continue;const edges=edgeSet(c.path);let overlap=0;for(const prev of picked){const pe=edgeSet(prev.path);overlap+=([...edges].filter(x=>pe.has(x)).length/Math.max(1,edges.size));}const score=c.cost+overlap*3.8;if(score<bestScore){best=c;bestScore=score;}}if(!best)break;picked.push(best);}

function roundedPolyline(points){
 const p=points.filter((a,i)=>!i||Math.hypot(a.x-points[i-1].x,a.y-points[i-1].y)>.1);
 if(p.length<2)return '';let d=`M${p[0].x},${p[0].y}`;
 for(let i=1;i<p.length-1;i++){const a=p[i-1],c=p[i],b=p[i+1],u=Math.hypot(c.x-a.x,c.y-a.y),v=Math.hypot(b.x-c.x,b.y-c.y),r=Math.min(12,u/3,v/3);if(!u||!v)continue;const x1=c.x+(a.x-c.x)*r/u,y1=c.y+(a.y-c.y)*r/u,x2=c.x+(b.x-c.x)*r/v,y2=c.y+(b.y-c.y)*r/v;d+=` L${x1},${y1} Q${c.x},${c.y} ${x2},${y2}`;}

function accessCablePath(a,b){
 // Keep cables out of the artwork/labels of unrelated devices. This matters when
 // a packet leaves the outer column of a LAN and passes the inner column.

 for(const y of ys)if(y>30&&y<WORLD.h-40)choices.push([A,{x:A.x,y},{x:B.x,y},B]);

function phaseLabel(){if(!transfer)return t('Ready','Sẵn sàng');return({split:t('SPLITTING FILE','ĐANG CHIA FILE'),header:t('ADDING HEADERS','ĐANG GẮN HEADER'),send:t('PACKETS IN TRANSIT','PACKET ĐANG TRUYỀN'),buffer:t('ALL PACKETS RECEIVED','ĐÃ NHẬN ĐỦ PACKET'),reorder:t('REORDER BY SEQUENCE','REORDER THEO SỐ THỨ TỰ'),assemble:t('REASSEMBLING FILE','ĐANG GHÉP FILE'),reformed:t('ORIGINAL FILE REFORMED','ĐÃ KHÔI PHỤC FILE GỐC'),save:t('SAVING TO HARD DISK','ĐANG LƯU VÀO Ổ CỨNG'),complete:t('SAVED TO RECEIVER’S DISK','ĐÃ LƯU VÀO Ổ CỨNG MÁY NHẬN'),cancelled:t('TRANSFER STOPPED','ĐÃ DỪNG PHIÊN TRUYỀN')})[transfer.phase];}
function phaseMessage(){const a=transfer;if(!a)return'';switch(a.phase){case'split':return t(`Divide ${a.file.mb} MB into ${a.total} payload blocks of 64 KB.`,`Chia ${a.file.mb} MB thành ${a.total} khối payload 64 KB.`);case'header':return t('Attach source IP, destination IP and a sequence number to every block.','Gắn IP nguồn, IP đích và số thứ tự cho từng khối dữ liệu.');case'send':return t('Packets are travelling independently. Watch the arrival order, not just the sending order.','Packet được chuyển tiếp độc lập. Quan sát thứ tự đến, không chỉ thứ tự gửi.');case'buffer':return t('The receiver has every packet. The file is not delivered yet.','Máy nhận đã có đủ packet. File chưa được giao cho người nhận.');case'reorder':return t('Move each packet to its position using the sequence number.','Đưa từng packet về đúng vị trí dựa trên sequence number.');case'assemble':return t('Remove the teaching headers and join the ordered payloads into the original file.','Bỏ phần header mô phỏng, ghép payload đã xếp đúng để khôi phục file.');case'reformed':return t('The original filename, type and size have been restored. The complete file is in RAM, not yet on disk.','Đã khôi phục tên, loại file và dung lượng gốc. File đang ở RAM, chưa lưu vào ổ cứng.');case'save':return t('Write the reformed file from RAM to the receiver’s hard disk.','Ghi file đã khôi phục từ RAM vào ổ cứng máy nhận.');case'complete':return t(`The reformed file is saved to ${a.dest.label}’s hard disk. The receiver has been notified.`,`Đã lưu file khôi phục vào ổ cứng ${a.dest.label}. Người nhận đã được thông báo.`);default:return t('Stopped: no incomplete file was delivered.','Đã dừng: không giao file chưa hoàn chỉnh.');}}

 <p>${t('For simple classroom arithmetic, MB and KB here use binary multiples: 1 MB = 1,024 KB and 1 KB = 1,024 bytes. Each 64 KB unit is a simulated payload block; header overhead is shown separately and not added to the file-size arithmetic. This is not an actual 64 KB IP datagram. Real IPv4 datagrams have a total-length limit of 65,535 bytes including their header.','Để tính toán đơn giản trên lớp, MB và KB ở đây dùng bội nhị phân: 1 MB = 1.024 KB; 1 KB = 1.024 byte. Mỗi khối 64 KB là payload mô phỏng; overhead của header được thể hiện riêng và không cộng vào phép tính dung lượng file. Đây không phải IP datagram 64 KB thật. IPv4 giới hạn tổng datagram ở 65.535 byte, gồm cả header.')} <a href="https://www.rfc-editor.org/rfc/rfc791" target="_blank" rel="noopener">RFC 791</a>.</p>
 <p>${t('The model numbers packets 1…N. In TCP, sequence numbers identify positions in a byte stream. Our source/destination/sequence/check block combines ideas from multiple protocol layers; SIM CHECK is a visual placeholder, not a checksum of a real file.','Mô hình đánh số packet 1…N. TCP dùng sequence number để xác định vị trí byte trong luồng. Khối source/destination/sequence/check trong lab kết hợp các ý từ nhiều tầng giao thức; SIM CHECK là giá trị minh hoạ, không phải checksum của file thật.')} <a href="https://www.rfc-editor.org/rfc/rfc9293" target="_blank" rel="noopener">RFC 9293</a>.</p>
 <p>${t('To make packet switching visible, this lab deliberately distributes packets over up to three loop-free routes and gives links different delays. In real networks, packets may follow the same route; multipath forwarding often keeps one flow on one path to limit reordering. The coloured route is not carried as a router list in our displayed packet header.','Để dễ quan sát, lab chủ động phân phối packet trên tối đa 3 tuyến không lặp và dùng độ trễ khác nhau. Trong mạng thật, các packet có thể cùng đi một tuyến; cơ chế đa đường thường giữ một luồng trên cùng tuyến để giảm đảo thứ tự. Tuyến màu không phải danh sách router được gắn trong header hiển thị.')} <a href="https://www.rfc-editor.org/rfc/rfc2991" target="_blank" rel="noopener">RFC 2991</a>.</p>
 <p>${t('This lesson waits for the whole file before the visible REORDER stage so students can see every step. Real receivers can reorder and deliver available data incrementally. No packet loss, retransmission, congestion-control algorithm, DNS or real external network traffic is simulated here. Router-to-router links have /30 interface addresses; each router label shows its /32 loopback.','Bài này chờ nhận đủ file trước bước REORDER để học sinh quan sát rõ từng công đoạn. Máy nhận thực có thể sắp xếp và giao dữ liệu dần. Lab không mô phỏng mất gói, truyền lại, thuật toán điều khiển tắc nghẽn, DNS hoặc lưu lượng mạng ngoài. Đường giữa router có địa chỉ giao diện /30; nhãn router hiển thị loopback /32.')}</p>

 showModal('help',t('How this lab works','Hướng dẫn Lab 03'),'RGSV · COMPUTER SCIENCE',body,'','help-modal');

  if(phase==='send'){const arrivalK=ease((a.time-p.arrivalTime)/.55);x=8+(fx-8)*arrivalK;y=9+(fy-9)*arrivalK;opacity=.35+.65*arrivalK;}
  if(phase==='assemble'){x+=(165-x)*merge;y+=(104-y)*merge;sc=1-.78*merge;opacity=1-merge;}
  tileDisplay(tile,p,x,y,sc,opacity,true);
 }
 setAttr(r['arrival-area'],'opacity',late?'0':'1');setAttr(r['order-area'],'opacity',phase==='assemble'?(1-merge).toFixed(2):reformed?'0':'1');
 setAttr(r['restore-file'],'opacity',saving?'0':phase==='reformed'?'1':phase==='assemble'?ease(clamp((progress-.27)/.65,0,1)).toFixed(3):'0');
 setText(r['restore-title'],t('Original file reformed','Đã khôi phục file gốc'));setText(r['restore-sub'],t('In RAM · not saved to disk yet','Trong RAM · chưa lưu vào ổ cứng'));
 setAttr(r['save-scene'],'opacity',saving?'1':'0');
 setText(r['save-title'],phase==='complete'?t('FILE SAVED · RECEIVER NOTIFIED','ĐÃ LƯU FILE · THÔNG BÁO NGƯỜI NHẬN'):t('WRITE THE REFORMED FILE TO DISK','GHI FILE ĐÃ KHÔI PHỤC VÀO Ổ CỨNG'));
 setText(r['disk-title'],t('HARD DISK','Ổ CỨNG'));setText(r['disk-percent'],phase==='complete'?t('100% written · file available in C:\\Received','Ghi 100% · file có trong C:\\Received'):t(`Writing ${Math.floor(progress*100)}% · wait until complete`,`Đang ghi ${Math.floor(progress*100)}% · chờ hoàn thành`));
 const writeK=phase==='complete'?1:ease(clamp((progress-.15)/.6,0,1)),writeX=30+(236-30)*writeK,writeY=51+(183-51)*writeK;
 setAttr(r['writing-file'],'transform',`translate(${writeX.toFixed(1)} ${writeY.toFixed(1)}) scale(${(1-.7*writeK).toFixed(3)})`);setAttr(r['writing-file'],'opacity',phase==='complete'?'0':(1-ease(clamp((writeK-.75)/.25,0,1))).toFixed(3));
 setAttr(r['memory-file'],'opacity',phase==='complete'?'1':'.22');setAttr(r['saved-check'],'opacity',phase==='complete'?'1':'0');setAttr(r['disk-led'],'fill',phase==='complete'?'#379980':phase==='save'?(Math.floor(a.time*6)%2?'#73ba88':'#c9ad5c'):'#9eb1bd');
 r.pagination.hidden=late;r['disk-location'].hidden=!saving;
 if(saving)setText(r['disk-location'],`${a.dest.label} · C:\\Received\\${a.file.name}`);
 r['disk-open'].hidden=phase!=='complete';
 const explanations={send:t('Packets are shown in the order they actually arrive. Nothing has been reassembled or saved yet.','Packet hiển thị theo thứ tự đến thực tế. Chưa ghép file hoặc lưu vào ổ cứng.'),buffer:t('All packets have arrived. Next, watch each numbered tile move into its correct position below.','Đã nhận đủ packet. Tiếp theo, từng ô đánh số sẽ di chuyển xuống đúng vị trí bên dưới.'),reorder:t('Arrival order → sequence order. Every tile moves to the slot indicated by its sequence number.','Thứ tự đến → thứ tự sequence. Mỗi ô di chuyển tới vị trí đúng theo số thứ tự.'),assemble:t(`${a.total} ordered payloads → one ${a.file.mb} MB file. The teaching headers are removed.`,`${a.total} payload đúng thứ tự → một file ${a.file.mb} MB. Bỏ các header mô phỏng.`),reformed:t('The same filename, file type and full size are restored. The complete file is still in RAM before the disk write.','Đã khôi phục đúng tên, loại file và toàn bộ dung lượng. File hoàn chỉnh vẫn ở RAM, chuẩn bị ghi vào ổ cứng.'),save:t('The reformed file moves into the hard disk. The receiver is notified only when this write finishes.','File đã khôi phục chuyển vào ổ cứng. Chỉ thông báo cho người nhận khi đã ghi xong.'),complete:t(`Saved ${a.file.name} (${a.file.mb} MB). The original file remains on the sender.`, `Đã lưu ${a.file.name} (${a.file.mb} MB). Máy gửi vẫn giữ file gốc.`)};
 const placeStart=Math.min(pg.end,pg.start+Math.floor(reorderCursor)*batch),placeEnd=Math.min(pg.end,placeStart+batch-1);const detail=phase==='reorder'?t(`Place ${placeStart===placeEnd?'#'+placeStart:'#'+placeStart+'–'+placeEnd} into the matching numbered slot${batch===1?'':'s'}. The other packets wait in the arrival buffer.`,`Đưa ${placeStart===placeEnd?'#'+placeStart:'#'+placeStart+'–'+placeEnd} xuống ô đúng số thứ tự. Các packet khác chờ trong bộ đệm đến.`):explanations[phase]||'';setText(r.explanation,detail);updateCommonWindow('receiver',phase==='send'?a.arrivals.length/a.total:phase==='buffer'||phase==='reformed'||phase==='complete'?1:progress);
}
function deviceScreenPoint(n){const svg=$('#network'),area=$('#map-area').getBoundingClientRect(),m=svg.getScreenCTM();if(!m)return{x:0,y:0};const p=new DOMPoint(n.x,n.y).matrixTransform(m);return{x:p.x-area.left,y:p.y-area.top};}
function rectsOverlap(a,b,gap=8){return a.x<b.x+b.w+gap&&a.x+a.w+gap>b.x&&a.y<b.y+b.h+gap&&a.y+a.h+gap>b.y;}
function positionProcessWindows(){const a=transfer;if(!a||!visualWindows.els.sender)return;const area=$('#map-area'),w=area.clientWidth,h=area.clientHeight,padding=8,placed=[],paths=[],orbs=[];let sourcePoint=deviceScreenPoint(a.source),destPoint=deviceScreenPoint(a.dest);
 for(const role of ['sender','receiver']){const s=visualWindows[role],c=visualWindows.els[role],el=c.el;if(el.hidden)continue;el.style.maxWidth=Math.max(230,w-16)+'px';const p=role==='sender'?sourcePoint:destPoint,other=role==='sender'?destPoint:sourcePoint;let width=el.offsetWidth,height=el.offsetHeight,dir=p.x<w/2?1:-1;
  let x=s.offset?p.x+s.offset.x:dir>0?p.x+44:p.x-width-44,y=s.offset?p.y+s.offset.y:p.y-58;
  x=clamp(x,padding,Math.max(padding,w-width-padding));y=clamp(y,padding,Math.max(padding,h-height-padding));
  if(!s.offset&&placed.some(b=>rectsOverlap({x,y,w:width,h:height},b))){
   const candidates=[{x,y},...placed.flatMap(b=>[{x:b.x+b.w+10,y},{x:b.x-width-10,y},{x,y:b.y+b.h+10},{x,y:b.y-height-10}]),{x,y:p.y+92},{x,y:p.y-height-88},{x:padding,y:h-height-padding},{x:w-width-padding,y:h-height-padding},{x:w-width-padding,y:padding},{x:padding,y:padding}].map(q=>({x:clamp(q.x,padding,Math.max(padding,w-width-padding)),y:clamp(q.y,padding,Math.max(padding,h-height-padding))}));
   const cover=(q,pt)=>pt.x>q.x-20&&pt.x<q.x+width+20&&pt.y>q.y-26&&pt.y<q.y+height+35;
   const score=q=>placed.filter(b=>rectsOverlap({...q,w:width,h:height},b)).length*10000+(cover(q,p)?30000:0)+(cover(q,other)?20000:0)+Math.abs(q.x-x)+Math.abs(q.y-y)*.7;
   candidates.sort((u,v)=>score(u)-score(v));x=candidates[0].x;y=candidates[0].y;
  }
  el.style.left=x.toFixed(1)+'px';el.style.top=y.toFixed(1)+'px';placed.push({x,y,w:width,h:height});
  const centre={x:x+width/2,y:y+height/2};let q={x:clamp(p.x,x+17,x+width-17),y:p.y<y?y:p.y>y+height?y+height:clamp(p.y,y+15,y+height-15)};
  if(p.x<x)q.x=x;else if(p.x>x+width)q.x=x+width;else if(p.y>=y&&p.y<=y+height)q=p.x<centre.x?{x,y:clamp(p.y,y+15,y+height-15)}:{x:x+width,y:clamp(p.y,y+15,y+height-15)};
  const col=role==='sender'?'#be9850':'#438e7d',dx=q.x-p.x;paths.push(`<path d="M${p.x},${p.y} C${p.x+dx*.42},${p.y} ${q.x-dx*.3},${q.y} ${q.x},${q.y}" stroke="${col}" opacity=".72"/><circle cx="${p.x}" cy="${p.y}" r="5" fill="white" stroke="${col}" stroke-width="1.6"/>`);
  if(role==='receiver'&&a.phase==='send')for(const seq of a.arrivals.slice(-6)){const pkt=a.packets[seq-1],k=(a.time-pkt.arrivalTime)/.5;if(k<0||k>1)continue;const f=ease(k),px=p.x+(q.x-p.x)*f,py=p.y+(q.y-p.y)*f;orbs.push(`<g transform="translate(${px} ${py})"><circle r="10" fill="${ROUTE_COLOURS[pkt.route]}" stroke="white" stroke-width="1.4"/><text y=".5">${seq}</text></g>`);}
 }
 $('#process-connectors').innerHTML=paths.join('')+orbs.join('');
}
function refreshVisuals(){if(transfer&&transfer.phase!=='cancelled')syncProcessWindows();else if($('#process-windows'))$('#process-windows').hidden=true;}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-viz-action]');if(btn){const action=btn.dataset.vizAction,role=btn.dataset.role,s=visualWindows[role];if(action==='tools'){document.body.classList.toggle('tools-open');setCloseupMode(!!transfer);refreshVisuals();return;}if(action==='windows'){if(transfer){setCloseupMode(true);for(const r of ['sender','receiver']){visualWindows[r].manual=false;visualWindows[r].offset=null;}refreshVisuals();}return;}if(!s||btn.disabled)return;
 if(action==='collapse'){s.collapsed=!s.collapsed;s.manual=true;}else if(action==='size'){s.large=!s.large;s.collapsed=false;s.manual=true;}else if(action==='anchor'){s.offset=null;}else if(action==='prev'){s.page--;s.follow=false;}else if(action==='next'){s.page++;s.follow=false;}else if(action==='follow'){s.follow=true;}refreshVisuals();return;}
 const tile=e.target.closest('[data-viz-seq]');if(tile){ui.packetId=Number(tile.dataset.vizSeq);ui.packetPinned=true;const a=transfer;if(a){toast(t(`Packet #${ui.packetId}: SRC ${a.source.ip} → DST ${a.dest.ip} · 64 KB`,`Packet #${ui.packetId}: nguồn ${a.source.ip} → đích ${a.dest.ip} · 64 KB`));if(ui.view==='transfer')updatePacketInspector(true);}}});
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-viz-drag]');if(!handle||e.target.closest('button')||e.button!==0)return;const role=handle.dataset.vizDrag,el=visualWindows.els[role].el;visualWindows.drag={role,handle,pointer:e.pointerId,x:e.clientX,y:e.clientY,left:parseFloat(el.style.left)||0,top:parseFloat(el.style.top)||0};handle.setPointerCapture(e.pointerId);e.preventDefault();});
document.addEventListener('pointermove',e=>{const d=visualWindows.drag;if(!d||e.pointerId!==d.pointer||!transfer)return;const p=deviceScreenPoint(d.role==='sender'?transfer.source:transfer.dest);visualWindows[d.role].offset={x:d.left+e.clientX-d.x-p.x,y:d.top+e.clientY-d.y-p.y};positionProcessWindows();});
function endVizDrag(e){const d=visualWindows.drag;if(!d||e.pointerId!==d.pointer)return;try{d.handle.releasePointerCapture(d.pointer);}catch(err){}visualWindows.drag=null;}
document.addEventListener('pointerup',endVizDrag);document.addEventListener('pointercancel',endVizDrag);
document.addEventListener('keydown',e=>{if(e.target.closest('[data-viz-seq]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.closest('[data-viz-seq]').dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{if(e.target.id==='visual-speed'){const val=Number(e.target.value);if([.5,1,2,4,8].includes(val)){ui.speed=val;const sidebarSpeed=$('#speed-select');if(sidebarSpeed)sidebarSpeed.value=String(val);}}});
window.addEventListener('resize',()=>{positionProcessWindows();});

loadVirtualDisks();mountProcessWindows();
renderChrome();renderEdges();updateView();requestAnimationFrame(frame);
