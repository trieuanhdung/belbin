<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Materials for your Fish Tank projects</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#243746;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:22px 18px}h1{font-size:20px;font-weight:600;line-height:1.4;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 18px}figure{margin:0;min-width:0}.image{height:190px;display:flex;align-items:center;justify-content:center;border:1px solid #e4e9ed;border-radius:5px;overflow:hidden;background-color:#fff;background-image:conic-gradient(#f0f3f5 25%,transparent 0 50%,#f0f3f5 0 75%,transparent 0);background-size:20px 20px}.image img{display:block;max-width:94%;max-height:94%;object-fit:contain}.backdrop .image{background:#fff}.bubbles .image{background:#467d9e}figcaption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12px;margin-top:7px}a{color:#17698e;text-decoration:none}a:hover{text-decoration:underline}a:focus-visible{outline:2px solid #17698e;outline-offset:3px}.download{white-space:nowrap}#status{font-size:13px;color:#677982;margin:18px 0}#status[hidden]{display:none}noscript{display:block;margin:18px 0}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:18px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.image{height:165px}h1{font-size:18px}figcaption{flex-wrap:wrap;gap:3px}}@media(max-width:330px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Materials for your Fish Tank projects</h1>
<div id="grid" class="grid" aria-label="Fish tank images"></div>
<p id="status" role="status" aria-live="polite">Loading images…</p>
<noscript>Please enable JavaScript to see the images.</noscript>
</main>
<script>
'use strict';
const items=[['goldfish','Golden fish',0,0,160,115],['tropical-angelfish','Tropical angelfish',160,0,153,160],['striped-angelfish','Striped angelfish',320,0,151,160],['pink-fish','Pink fish',480,0,160,131],['blue-fish','Blue piranha',0,160,160,93],['clownfish','Clownfish',160,160,160,108],['seahorse','Green seahorse',320,160,82,160],['diver-blue','Blue diver',480,160,160,137],['diver-yellow','Yellow diver',0,320,160,147],['frog-sitting','Sitting frog',160,320,151,160],['frog-jumping','Jumping frog',320,320,147,160]];
const grid=document.getElementById('grid'),status=document.getElementById('status');
async function loadImage(paths){const data=(await Promise.all(paths.map(async path=>{const r=await fetch(path);if(!r.ok)throw new Error('Unable to load the images. Please reload.');return(await r.text()).trim();}))).join('');return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Unable to display an image. Please try a current browser.'));im.src='data:image/avif;base64,'+data;});}
async function png(im,x,y,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,x,y,w,h,0,0,w,h);return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('Image export failed.')),'image/png'));}
function add(id,name,blob,ext='png',category=''){const url=URL.createObjectURL(blob),filename=id+'.'+ext,card=document.createElement('figure');card.className=category;const imageLink=document.createElement('a');imageLink.className='image';imageLink.href=url;imageLink.download=filename;imageLink.title='Download '+name;const im=document.createElement('img');im.alt=name;im.src=url;imageLink.append(im);const caption=document.createElement('figcaption'),label=document.createElement('span'),download=document.createElement('a');label.textContent=name;download.className='download';download.href=url;download.download=filename;download.textContent='Download '+ext.toUpperCase();download.setAttribute('aria-label','Download '+name+' as '+ext.toUpperCase());caption.append(label,download);card.append(imageLink,caption);grid.append(card);}
// GIF89a encoder: transparent background and a repeating 72-frame bubble loop.
const W=512,H=512,N=72,DELAY=8,PALETTE=[[0,0,0],[120,210,255],[220,245,255],[255,255,255],[165,225,255],[73,157,206],[196,236,255],[230,249,255]];
function lzw(pixels){const out=[];let bits=0,held=0,width=4,next=10,dict=new Map();const emit=code=>{held|=code<<bits;bits+=width;while(bits>=8){out.push(held&255);held>>>=8;bits-=8;}};emit(8);let prefix=pixels[0];for(let i=1;i<pixels.length;i++){const value=pixels[i],key=prefix*8+value,found=dict.get(key);if(found!==undefined){prefix=found;continue;}emit(prefix);dict.set(key,next++);if(next>(1<<width)&&width<12)width++;if(next>=4096){emit(8);dict=new Map();width=4;next=10;}prefix=value;}emit(prefix);if(next===(1<<width)&&width<12)width++;emit(9);if(bits)out.push(held&255);return new Uint8Array(out);}
function gifHeader(){const b=[];for(const c of 'GIF89a')b.push(c.charCodeAt(0));b.push(W&255,W>>8,H&255,H>>8,0xF2,0,0);for(const c of PALETTE)b.push(...c);b.push(0x21,0xFF,11);for(const c of 'NETSCAPE2.0')b.push(c.charCodeAt(0));b.push(3,1,0,0,0);return new Uint8Array(b);}
function gifFrame(pixels){const b=[0x21,0xF9,4,9,DELAY,0,0,0,0x2C,0,0,0,0,W&255,W>>8,H&255,H>>8,0,3],p=lzw(pixels);for(let i=0;i<p.length;i+=255){const end=Math.min(i+255,p.length);b.push(end-i);for(let j=i;j<end;j++)b.push(p[j]);}b.push(0);return new Uint8Array(b);}
let seed=7;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
const bubbles=Array.from({length:38},(_,i)=>({x:34+random()*444,r:i<14?8+Math.floor(random()*17):3+Math.floor(random()*5),phase:random()*576,sway:3+random()*10,angle:random()*Math.PI*2}));
function disk(p,x,y,r,col){for(let dy=-r;dy<=r;dy++){const yy=y+dy;if(yy<0||yy>=H)continue;const half=Math.floor(Math.sqrt(r*r-dy*dy)),left=Math.max(0,x-half),right=Math.min(W-1,x+half);if(right>=left)p.fill(col,yy*W+left,yy*W+right+1);}}
function renderFrame(frame){const p=new Uint8Array(W*H),t=frame/N;for(const b of bubbles){const y=Math.round(H+32-((b.phase+t*576)%576)),x=Math.round(b.x+Math.sin(t*Math.PI*2+b.angle)*b.sway),rim=Math.max(1,Math.floor(b.r/7));disk(p,x,y,b.r,1);disk(p,x,y,Math.max(1,b.r-rim),4);if(b.r>7){const r=Math.round(b.r*.75);for(let a=210;a<=340;a+=4){const angle=a*Math.PI/180,xx=x+Math.round(Math.cos(angle)*r),yy=y+Math.round(Math.sin(angle)*r);if(xx>=0&&xx<W&&yy>=0&&yy<H)p[yy*W+xx]=2;}}disk(p,x-Math.round(b.r*.30),y-Math.round(b.r*.32),Math.max(1,Math.round(b.r*.20)),3);}return p;}
async function init(){const [atlas,bg]=await Promise.all([loadImage(['data/a1.txt','data/a2.txt','data/a3.txt']),loadImage(['data/backdrop.txt'])]);add('aquarium-backdrop','Aquarium backdrop',await png(bg,0,0,480,360),'png','backdrop');for(const [id,name,x,y,w,h] of items)add(id,name,await png(atlas,x,y,w,h));status.textContent='Loading bubbles…';const parts=[gifHeader()];for(let f=0;f<N;f++){parts.push(gifFrame(renderFrame(f)));if(f%8===0)await new Promise(r=>setTimeout(r,0));}parts.push(new Uint8Array([0x3b]));add('underwater-bubbles','Animated bubbles',new Blob(parts,{type:'image/gif'}),'gif','bubbles');status.hidden=true;}
init().catch(e=>{console.error(e);status.hidden=false;status.textContent=e.message;});
</script>
</body>
</html>
