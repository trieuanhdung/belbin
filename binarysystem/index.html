  let bytes = Uint8Array.from(atob(packed.replace(/\s+/g, '')), c => c.charCodeAt(0));
  if (typeof DecompressionStream === 'undefined') throw new Error('Please open this lab in a recent version of Chrome, Edge, Firefox or Safari.');
  bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  const digest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), b => b.toString(16).padStart(2, '0')).join('');
  if (digest !== '371bfd07580c141b467deb9bb351a50374e95db7f15d236bc91a4ed22e7273fa') throw new Error('The resource did not pass its integrity check. Please refresh the page.');
  let html = new TextDecoder('utf-8', {fatal: true}).decode(bytes);
  const anchor = 'newAdditionExample();newShiftExample();state.twosValue=-rand(1,63);';
  if (html.split(anchor).length !== 2) throw new Error('The resource version could not be updated. Please refresh.');
  html = html.replace(anchor, '(' + installColumnPractice.toString() + ')();\n' + anchor);
  const updatedDigest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html))), b => b.toString(16).padStart(2, '0')).join('');
  if (updatedDigest !== '27e20a51a69d05d6e95de474ad0735f731aa681651b329741598d6cc6a2667eb') throw new Error('The updated resource did not pass its integrity check. Please refresh.');
  document.open(); document.write(html); document.close();

});
