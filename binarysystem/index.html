const TOPICS = {
 binary:{num:'01',title:'Binary numbers',short:'Binary',sub:'Bits & place values',base:'BASE 2',desc:'Every bit has a place. Switch bits on and off, explore their values, then put your understanding into practice.',art:'0010 1101',artSub:'ONE BYTE · EIGHT BITS',symbol:'01'},
 hex:{num:'02',title:'Hexadecimal numbers',short:'Hexadecimal',sub:'Hex digits & nibbles',base:'BASE 16',desc:'A shorter way to write binary. Connect each hexadecimal digit to its four-bit nibble and convert with confidence.',art:'2D → 0010 1101',artSub:'ONE HEX DIGIT = FOUR BITS',symbol:'0F'},
 operations:{num:'03',title:'Binary operations',short:'Operations',sub:'Addition & shifting',base:'BIT BY BIT',desc:'Watch the carry move. Follow each shift. Find out what happens when a result no longer fits inside the register.',art:'0101101 + 0011011',artSub:'7-BIT REGISTERS · RANDOM INPUTS',symbol:'＋'},
 twos:{num:'04',title:'Two’s complement',short:'Two’s complement',sub:'Positive → negative · 2 methods',base:'SIGNED INTEGERS',desc:'Explore signed 7-bit values, then turn a positive number into its negative using two step-by-step two’s complement methods.',art:'1011011',artSub:'−37 IN SEVEN BITS · TWO METHODS',symbol:'±'},
 quiz:{num:'05',title:'Quiz studio',short:'Quiz',sub:'Put it all together',base:'CHECK YOUR UNDERSTANDING',desc:'Build a quiz around the skills you want to practise. Review each answer and see exactly where to focus next.',art:'THINK → SOLVE',artSub:'YOUR NEXT CHALLENGE',symbol:'quiz'}
};
const topicIds = ['binary','hex','operations','twos'];
const WIDTHS = [4,8,16];
const ARITH_WIDTH = 7;
const LEARN_ARITH_WIDTHS = [7,8];
const widthFor = (topic, requested) => ['operations','twos'].includes(topic) ? ARITH_WIDTH : requested;
const learningWidth = () => ['operations','twos'].includes(state.topic) && state.tab==='explore' ? state.arithmeticLearnWidth : widthFor(state.topic,state.width);
const STORAGE_KEY = 'rgsv-number-systems-lab-v1';
const blankStats = () => Object.fromEntries(topicIds.map(t=>[t,{attempted:0,solved:0,first:0,revealed:0}]));
let storageOK = true;
let persisted = {};
try {persisted = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};} catch {storageOK=false;}
const stats = blankStats();
for (const t of topicIds) for (const k of ['attempted','solved','first','revealed']) {
 const n=persisted.stats?.[t]?.[k]; if (Number.isInteger(n)&&n>=0&&n<10000000) stats[t][k]=n;
}
const state = {
 topic:'binary', tab:'explore', width:WIDTHS.includes(persisted.width)?persisted.width:8,
 arithmeticLearnWidth:LEARN_ARITH_WIDTHS.includes(persisted.arithmeticLearnWidth)?persisted.arithmeticLearnWidth:ARITH_WIDTH,
 name:typeof persisted.name==='string'?persisted.name.slice(0,60):'',
 stats, history:Array.isArray(persisted.history)?persisted.history.filter(h=>h&&Number.isFinite(h.score)&&Number.isFinite(h.total)&&typeof h.date==='string').slice(-20):[],
 binaryValue:45, hexValue:45, twosValue:0, addA:0, addB:0, addStep:0,
 opTab:'addition', shiftInitial:0, shiftKind:'left', shiftAmount:1, shiftDone:0, shiftCase:'exact', negationDrill:null,
 practice:{}, modes:{binary:'mixed',hex:'mixed',operations:'mixed',twos:'negate-invert'},
 quizSettings:{count:20,width:8,mode:'revision',minutes:0,topics:[...topicIds]},
 quiz:null, reviewWrong:false, lastShiftAnimated:false
};
// A saved live quiz may be resumed. Validate its shape before trusting browser storage.
function isRestorableQuiz(q) {
 return q && Array.isArray(q.questions) && q.questions.length>0 && q.questions.length<=60 &&
 q.questions.every(x=>x&&topicIds.includes(x.topic)&&typeof x.prompt==='string'&&typeof x.answer==='string'&&Array.isArray(x.steps)&&x.steps.every(t=>typeof t==='string')&&typeof x.display==='string'&&['binary','hex','denary','choice'].includes(x.answerType)&&(x.answerType!=='choice'||(Array.isArray(x.choices)&&x.choices.every(c=>typeof c==='string')))) &&
 [4,7,8,16].includes(q.width) && typeof q.name==='string' && Array.isArray(q.flags) && q.flags.every(i=>Number.isInteger(i)&&i>=0&&i<q.questions.length) && Array.isArray(q.responses)&&q.responses.length===q.questions.length && q.responses.every(r=>r&&typeof r.value==='string'&&typeof r.submitted==='boolean') &&
 typeof q.started==='number' && Number.isFinite(q.started) && Number.isInteger(q.index) && q.index>=0 && q.index<q.questions.length &&
 ['revision','challenge'].includes(q.mode) && [null,undefined].includes(q.ended) &&
 (q.deadline===null || Number.isFinite(q.deadline));
}
if(persisted.activeQuiz?.revision==='2.0'&&isRestorableQuiz(persisted.activeQuiz)) state.quiz=persisted.activeQuiz;
if(state.width===4){state.binaryValue=13;state.hexValue=13;}
function save() {
 try {localStorage.setItem(STORAGE_KEY,JSON.stringify({name:state.name,stats:state.stats,history:state.history,width:state.width,arithmeticLearnWidth:state.arithmeticLearnWidth,activeQuiz:state.quiz&&!state.quiz.ended?state.quiz:null}));storageOK=true;}
 catch {storageOK=false;}
}
const rand = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const pick = a => a[rand(0,a.length-1)];
const shuffled = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const modulus = w => 2**w;
const wrap = (n,w) => ((n%modulus(w))+modulus(w))%modulus(w);
const bits = (n,w=state.width) => wrap(n,w).toString(2).padStart(w,'0');
const hex = (n,w=state.width) => wrap(n,w).toString(16).toUpperCase().padStart(Math.ceil(w/4),'0');
const group = s => String(s).length%4 ? String(s) : String(s).replace(/(.{4})(?=.)/g,'$1 ');
const signed = (n,w=state.width) => n>=2**(w-1)?n-2**w:n;
const signedBits = (s) => signed(parseInt(s,2),s.length);
const pct = (a,b) => b?Math.round(100*a/b):0;
const formatTime = ms => {const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;};
const numToken = (v,b) => `<span class="number-token ${String(v).length>12?'long':''}">${esc(v)}${b?`<sub>${b}</sub>`:''}</span>`;

function conceptualQuestion(topic,w) {

 hex:[['How many binary bits correspond to one hexadecimal digit?',['2','4','8','16'],'4','One hexadecimal digit has 16 possible values. Four bits also have 2⁴ = 16 patterns.'],['What denary value does hexadecimal F represent?',['6','10','15','16'],'15','Hexadecimal uses 0–9, then A = 10 through F = 15.']],

 const [prompt,choices,answer,explanation]=pick(banks[topic]);

function normalise(q,raw) {

function renderExplore(){return {binary:renderBinary,hex:renderHex,operations:renderOperations,twos:renderTwos}[state.topic]();}
function valueTiles(n,w,firstLabel='DENARY',firstValue=n){return `<div class="results-row"><div class="result-tile highlight"><label>${firstLabel}</label><strong>${firstValue}</strong></div><div class="result-tile"><label>HEXADECIMAL</label><strong>${hex(n,w)}</strong></div><div class="result-tile"><label>BINARY</label><strong class="binary-value">${group(bits(n,w))}</strong></div></div>`;}
function renderBinary(){const w=state.width,n=state.binaryValue;return `<div class="grid-main"><section class="card"><div class="card-head"><div><h2>The bit playground</h2><p>Click any bit to see its contribution to the number.</p></div><span class="badge">${ic('chip')} Interactive</span></div><div class="field-row"><div class="field"><label for="binary-denary">Denary value · 0 to ${2**w-1}</label><input type="number" id="binary-denary" value="${n}" min="0" max="${2**w-1}" step="1" data-change="binary-denary"></div><button class="btn" data-action="random-binary">${ic('shuffle')} Random</button><button class="btn" data-action="reset-binary">${ic('reset')} Clear</button></div><div class="section-kicker">PLACE VALUES</div>${bitBoard(n,w,'toggle-binary')}<div class="board-caption"><span>Most significant bit</span><span>Least significant bit</span></div><div class="equation">${weightedSum(n,w)} <strong>= ${n}</strong></div>${valueTiles(n,w)}${labFooter()}</section><aside class="side-panels"><section class="card insight"><h3>${ic('bulb')} The key idea</h3><p>Binary uses just <strong>0 and 1</strong>. Each place is worth twice the place to its right.</p><p>A <strong>1</strong> includes that place value.<br>A <strong>0</strong> leaves it out.</p><div class="info-note">Start at the right:<br><span class="mono">1, 2, 4, 8, 16, 32…</span></div><div class="mini-rule"><span>Smallest unsigned value</span><strong>0</strong></div><div class="mini-rule"><span>Largest in ${w} bits</span><strong>${2**w-1}</strong></div><div class="mini-rule"><span>Different patterns</span><strong>${2**w}</strong></div></section><section class="card insight"><h3>Try these explorations</h3><div class="mini-milestone"><span class="num">01</span><p>Switch on just one bit. What happens as you move left?</p></div><div class="mini-milestone"><span class="num">02</span><p>Make an odd number. Which bit must be switched on?</p></div><div class="mini-milestone"><span class="num">03</span><p>Make the largest possible number without typing it.</p></div></section></aside></div>`;}
function renderHex(){const n=state.hexValue,w=state.width,h=hex(n,w);return `<div class="grid-main"><section class="card"><div class="card-head"><div><h2>One digit. Four bits.</h2><p>Click a hex digit to cycle it, or toggle its binary bits.</p></div><span class="badge">NIBBLE EXPLORER</span></div><div class="field-row"><div class="field"><label for="hex-entry">Hexadecimal · 0 to ${'F'.repeat(w/4)}</label><input id="hex-entry" class="mono" value="${h}" type="text" maxlength="20" spellcheck="false" data-change="hex-entry" autocomplete="off"></div><div class="field"><label for="hex-denary">Denary · 0 to ${2**w-1}</label><input id="hex-denary" type="number" value="${n}" min="0" max="${2**w-1}" data-change="hex-denary"></div><button class="btn" data-action="random-hex">${ic('shuffle')} Random</button></div><div class="board-wrap"><div class="nibble-row" style="--digits:${w/4}">${h.split('').map((d,i)=>`<div class="nibble"><div class="nibble-label">PLACE VALUE ${16**(h.length-i-1)}</div><button class="hex-digit" id="hex-digit-${i}" data-action="cycle-hex" data-index="${i}" aria-label="Hexadecimal digit ${i+1}, ${d}. Increase by one, cycling F to zero.">${d}</button><div class="nibble-arrow">↓</div><div class="bit-grid" style="--n:4">${bits(parseInt(d,16),4).split('').map((b,j)=>`<div><span class="weight">${2**(3-j)}</span><button class="bit ${b==='1'?'on':''}" id="hex-bit-${i*4+j}" data-action="toggle-hex" data-index="${i*4+j}" aria-label="Nibble ${i+1}, bit weight ${2**(3-j)}, value ${b}. Toggle bit." aria-pressed="${b==='1'}">${b}</button></div>`).join('')}</div><div class="small muted" style="margin-top:11px">${parseInt(d,16)} in denary</div></div>`).join('')}</div></div><div class="equation">${powerExpression(n,w,16)} <strong>= ${n}</strong></div>${valueTiles(n,w)}${labFooter('Can you convert one nibble at a time?')}</section><aside class="side-panels"><section class="card insight"><h3>${ic('bulb')} Why base 16?</h3><p>A nibble contains <strong>4 bits</strong>, giving <strong>16 patterns</strong>. One hexadecimal digit represents exactly one nibble.</p><p>After 9, hexadecimal continues with <strong>A, B, C, D, E, F</strong>.</p><table class="reference-table"><thead><tr><th>Hex</th><th>Denary</th><th>Binary</th></tr></thead><tbody>${'ABCDEF'.split('').map(d=>`<tr><td><strong>${d}</strong></td><td>${parseInt(d,16)}</td><td>${parseInt(d,16).toString(2)}</td></tr>`).join('')}</tbody></table><div class="info-note">Keep <strong>four bits per digit</strong>.<br><span class="mono">3A = 0011 1010</span><br>Do not drop zeros within nibbles.</div></section><section class="card insight"><h3>Hexadecimal reference</h3><p>Top: hex digit. Below: denary value.</p><div class="hex-reference">${Array.from({length:16},(_,i)=>`<div class="hex-key">${i.toString(16).toUpperCase()}<span>${i}</span></div>`).join('')}</div></section></aside></div>`;}
function renderOperations(){return `<div class="segmented" role="group" aria-label="Operation"><button data-action="op-tab" data-tab="addition" class="${state.opTab==='addition'?'active':''}" aria-pressed="${state.opTab==='addition'}">01 · Binary addition</button><button data-action="op-tab" data-tab="shifting" class="${state.opTab==='shifting'?'active':''}" aria-pressed="${state.opTab==='shifting'}">02 · Multiply / divide with SHIFT</button></div>`+(state.opTab==='addition'?renderAddition():renderShift());}
function renderAddition(){
 const w=state.arithmeticLearnWidth,a=state.addA,b=state.addB,r=addition(a,b,w),step=state.addStep,done=step===w,pos=w-step;
 let grid=`<div class="add-label">Carry</div><div class="add-cell carry ${done?'out':''}" title="Final carry-out">${done?r.carry[0]:'·'}</div>`;
 for(let i=0;i<w;i++)grid+=`<div class="add-cell carry">${i>=w-step-1?r.carry[i+1]:'·'}</div>`;
 for(const [name,arr] of [['A',r.ab],['B',r.bb]]){
 grid+=`<div class="add-label">${name==='B'?'+ B':'A'}</div><div></div>`;
 for(let i=0;i<w;i++)grid+=`<button id="add-${name}-${i}" data-action="toggle-add" data-row="${name}" data-index="${i}" aria-label="Operand ${name}, bit ${w-i-1}: ${arr[i]}. Toggle bit." aria-pressed="${arr[i]==='1'}" class="add-cell ${arr[i]==='1'?'on':''} ${i===w-step-1?'current':''}">${arr[i]}</button>`;
 }
 grid+='<div class="add-rule"></div><div class="add-label">Sum</div><div class="add-cell out">'+(done?r.carry[0]:'?')+'</div>';
 for(let i=0;i<w;i++)grid+=`<div class="add-cell ${i>=w-step?'result':'unknown'}">${i>=w-step?r.result[i]:'?'}</div>`;
 const explanation=step?`<span class="mono">${r.ab[pos]} + ${r.bb[pos]} + ${r.carry[pos+1]} = ${r.totals[pos]}<sub>10</sub> = ${r.totals[pos].toString(2)}<sub>2</sub></span>Column weight ${2**(w-pos-1)}: write <strong>${r.result[pos]}</strong> and carry <strong>${r.carry[pos]}</strong> to the left.`:'Begin at the <strong>rightmost column</strong>. Add the two bits and any incoming carry. Click “Next column” to work through the sum.';
 return `<div class="grid-main"><section class="card"><div class="card-head"><div><h2>Follow the carry</h2><p>Random operands are loaded first. Add one column at a time in a ${w}-bit register.</p></div><span class="badge gold">${step} / ${w} COLUMNS</span></div><div class="field-row"><div class="field"><label for="add-a">Operand A · unsigned denary</label><input id="add-a" type="number" min="0" max="${2**w-1}" value="${a}" data-change="add-a"></div><div class="field"><label for="add-b">Operand B · unsigned denary</label><input id="add-b" type="number" min="0" max="${2**w-1}" value="${b}" data-change="add-b"></div><button class="btn" data-action="random-add">${ic('shuffle')} New random pair</button></div><div class="addition-wrap"><div class="addition-grid ${w>8?'wide':''}" style="--n:${w}">${grid}</div></div><div class="board-caption"><span>Gold column: carry outside the register</span><span>${w} stored bits →</span></div><div class="step-explanation" aria-live="polite">${explanation}</div><div class="buttons"><button class="btn primary" data-action="add-step" ${done?'disabled':''}>Next column ${ic('arrow')}</button><button class="btn" data-action="add-all" ${done?'disabled':''}>${ic('eye')} Show full sum</button><button class="btn link-btn" data-action="add-reset">${ic('reset')} Restart</button></div>${done?`<div class="flag-grid"><div class="flag"><span class="badge ${r.unsignedOverflow?'red':'navy'}">UNSIGNED OVERFLOW: ${r.unsignedOverflow?'YES':'NO'}</span><p>${a} + ${b} = <strong>${r.raw}</strong>.<br>Stored: <strong>${r.stored}</strong>. Carry-out: ${r.carry[0]}.</p></div><div class="flag"><span class="badge ${r.signedOverflow?'red':'navy'}">SIGNED OVERFLOW: ${r.signedOverflow?'YES':'NO'}</span><p>Same bits as two’s complement:<br>${signed(a,w)} + ${signed(b,w)} = <strong>${r.signedTotal}</strong>.<br>Stored signed value: <strong>${signed(r.stored,w)}</strong>.</p></div></div>`:''}${labFooter()}</section><aside class="side-panels"><section class="card insight"><h3>${ic('bulb')} The addition rules</h3>${[['0 + 0','0'],['0 + 1','1'],['1 + 1','10'],['1 + 1 + 1','11']].map(([a,b])=>`<div class="mini-rule"><span class="mono">${a}</span><strong>${b}<sub>2</sub></strong></div>`).join('')}<div class="info-note"><strong>10₂</strong> means write 0, carry 1.<br><strong>11₂</strong> means write 1, carry 1.</div></section><section class="card insight"><h3>Two different overflow tests</h3><p><strong>Unsigned:</strong> a final carry-out means the true result is larger than ${2**w-1}.</p><p><strong>Two’s complement:</strong> overflow occurs when the true sum falls outside ${-(2**(w-1))} to ${2**(w-1)-1}.</p><div class="info-note blue">Carry-out and signed overflow are <strong>not the same thing</strong>. The bits alone need an interpretation.</div></section></aside></div>`;
}
function renderShift(){const w=state.arithmeticLearnWidth,initial=bits(state.shiftInitial,w),kind=state.shiftKind,k=state.shiftDone,r=shiftBits(initial,kind,k),value=kind==='arithmetic'?signed(state.shiftInitial,w):state.shiftInitial,out=kind==='arithmetic'?signedBits(r.bits):parseInt(r.bits,2),done=k>=state.shiftAmount;
 const anim=state.lastShiftAnimated?(kind==='left'?'shift-left':'shift-right'):'';state.lastShiftAnimated=false;
 return `<div class="grid-main"><section class="card"><div class="card-head"><div><h2>The shift register</h2><p>A random value is ready. Predict the product or quotient, then apply each shift.</p></div><span class="badge">STEP ${k} / ${state.shiftAmount}</span></div><div class="field-row"><div class="field"><label for="shift-kind">Operation</label><select id="shift-kind" data-change="shift-kind">${Object.entries(SHIFTS).map(([v,l])=>`<option value="${v}" ${v===kind?'selected':''}>${v==='left'?'Multiply · logical left':v==='right'?'Divide · logical right':'Signed division · arithmetic right'}</option>`).join('')}</select></div><div class="field" style="max-width:120px"><label for="shift-amount">Places</label><select id="shift-amount" data-change="shift-amount">${Array.from({length:w-1},(_,i)=>`<option value="${i+1}" ${i+1===state.shiftAmount?'selected':''}>${i+1}</option>`).join('')}</select></div><div class="field"><label for="shift-case">Examples</label><select id="shift-case" data-change="shift-case"><option value="exact" ${state.shiftCase==='exact'?'selected':''}>Exact results</option><option value="challenge" ${state.shiftCase==='challenge'?'selected':''}>Overflow / remainder</option></select></div><button class="btn" data-action="random-shift">${ic('shuffle')} New random value</button></div><div class="task-banner"><span class="section-kicker">YOUR TASK · ${w}-BIT REGISTER</span><strong>${value} ${kind==='left'?'×':'÷'} ${2**state.shiftAmount} <span class="muted">= ?</span></strong><span class="small muted">Use ${state.shiftAmount} ${kind==='left'?'left':'right'} shift${state.shiftAmount===1?'':'s'}. ${kind==='arithmetic'?'Interpret the starting register as signed.':'Interpret the starting register as unsigned.'}</span></div><div class="shift-track-label"><span>STARTING PATTERN · CLICK TO EDIT</span><span>${kind==='arithmetic'?'Signed':'Unsigned'}: ${value}</span></div>${bitBoard(state.shiftInitial,w,'toggle-shift',kind==='arithmetic',{labels:false})}<div class="shift-arrow"><span class="arrow">${kind==='left'?'←':'→'}</span><span>${SHIFTS[kind].toUpperCase()} · ${k} PLACE${k===1?'':'S'} APPLIED</span><span class="arrow">${kind==='left'?'←':'→'}</span></div><div class="shift-track-label"><span>CURRENT REGISTER</span><span>${kind==='arithmetic'?'Signed':'Unsigned'}: ${out}</span></div>${bitBoard(parseInt(r.bits,2),w,'',kind==='arithmetic',{labels:false,animate:anim,inserted:k,kind})}<div class="equation">${k?(kind==='left'?`${value} × ${2**k} = ${value*2**k}; stored value <strong>${out}</strong>`:`floor(${value} ÷ ${2**k}) = <strong>${out}</strong>`):'No shifts applied yet. Predict the next pattern before moving the bits.'}</div><div class="buttons"><button class="btn primary" data-action="shift-step" ${done?'disabled':''}>Shift once ${ic('arrow')}</button><button class="btn" data-action="shift-all" ${done?'disabled':''}>Apply all ${state.shiftAmount} shifts</button><button class="btn link-btn" data-action="shift-reset">${ic('reset')} Reset</button></div>${k?`<div class="info-note ${kind==='left'&&state.shiftInitial*2**k>2**w-1?'red':'blue'}">${kind==='left'?(state.shiftInitial*2**k>2**w-1?`The exact unsigned product does not fit. A high 1 bit was discarded: the stored ${w}-bit value is not the full product.`:'The exact unsigned product fits: this shift multiplies the value by '+2**k+'.'):kind==='right'?'Logical right shift uses zero-fill. Quotient: '+out+'. Remainder: '+(value%2**k)+'. '+(value%2**k?'The discarded bits contain the remainder; this is integer division, not an exact fractional result.':'No non-zero bit was lost, so the division is exact.'):'Arithmetic right shift copies the sign bit. The signed value is divided by '+2**k+' and rounded down, towards negative infinity.'}</div><div style="margin-top:17px"><div class="section-kicker">SHIFT HISTORY</div>${r.history.map((h,i)=>`<div class="history-line"><span>Step ${i+1}</span><span class="mono">${group(h.bits)}</span><span>Out <b class="lost">${h.lost}</b> · In <b class="mono">${h.fill}</b></span></div>`).join('')}</div>`:''}${labFooter()}</section><aside class="side-panels"><section class="card insight"><h3>${ic('bulb')} Move, fill, discard</h3><div class="mini-milestone"><span class="num">←</span><p><strong>Logical left</strong><br>Bits move left; insert 0 on the right. Multiply by 2 per place only while the true result fits.</p></div><div class="mini-milestone"><span class="num">→</span><p><strong>Logical right</strong><br>Bits move right; insert 0 on the left. Unsigned integer division by 2 per place.</p></div><div class="mini-milestone"><span class="num">±</span><p><strong>Arithmetic right</strong><br>Bits move right; copy the sign bit on the left. This preserves the sign.</p></div><div class="info-note">The register stays at <strong>${w} bits</strong>. Bits that leave the register do not return.</div></section><section class="card insight"><h3>A useful experiment</h3><p>Start with the leftmost bit set to 1. Compare logical right and arithmetic right.</p><p>Now try <strong>−3</strong> with arithmetic right by one place. Why is the result <strong>−2</strong>, not −1?</p><button class="btn small-btn full" data-action="shift-negative">Load −3 example</button></section></aside></div>`;
}
function renderTwos(){const w=state.arithmeticLearnWidth,v=state.twosValue,n=wrap(v,w),half=2**(w-1),negative=v<0,mag=Math.abs(v),inv=2**w-1-mag;
 return `<div class="grid-main"><section class="card"><div class="card-head"><div><h2>Make room for negative numbers</h2><p>The leading bit has a negative place value, not a separate minus sign.</p></div><span class="badge ${negative?'red':'navy'}">${negative?'NEGATIVE':v===0?'ZERO':'POSITIVE'}</span></div><div class="field-row"><div class="field"><label for="twos-denary">Signed denary · ${-half} to ${half-1}</label><input id="twos-denary" type="number" value="${v}" min="${-half}" max="${half-1}" step="1" data-change="twos-denary"></div><button class="btn" data-action="random-twos">${ic('shuffle')} Random</button></div><input type="range" id="twos-slider" aria-label="Signed denary value slider" min="${-half}" max="${half-1}" value="${v}" data-input="twos-slider" data-change="twos-slider"><div class="sign-range"><span>${-half}</span><span>0</span><span>+${half-1}</span></div><div class="buttons" style="margin:14px 0 21px">${[[-half,'Minimum'],[-1,'−1'],[0,'Zero'],[half-1,'Maximum']].map(([n,l])=>`<button class="btn small-btn" data-action="twos-preset" data-value="${n}">${l}</button>`).join('')}</div><div class="section-kicker">SIGNED PLACE VALUES · CLICK TO EDIT</div>${bitBoard(n,w,'toggle-twos',true)}<div class="equation">${weightedSum(n,w,true)} <strong>= ${v}</strong></div>${valueTiles(n,w,'SIGNED DENARY',v)}<hr class="panel-divider"><h3>${negative?'Encode a negative integer':'Zero and positive integers'}</h3>${negative?`<div class="step-cards"><div class="step-card"><span class="step-num">1</span><h4>Magnitude</h4><div class="mono">${group(bits(mag,w))}</div><p>Write ${mag} as unsigned binary.</p></div><div class="step-card"><span class="step-num">2</span><h4>Invert the bits</h4><div class="mono">${group(bits(inv,w))}</div><p>Every 0 becomes 1; every 1 becomes 0.</p></div><div class="step-card final"><span class="step-num">3</span><h4>Add one</h4><div class="mono">${group(bits(v,w))}</div><p>Keep exactly ${w} bits. This represents ${v}.</p></div></div>`:`<div class="info-note blue">Write ordinary binary, padded to ${w} bits. The sign bit is <strong>0</strong>. Do not invert or add 1 for a zero or positive input.</div>`}${v===-half?`<div class="info-note red">Boundary case: ${-half} is representable, but +${half} is not a signed ${w}-bit value. Step 1 above uses its <strong>unsigned magnitude</strong>. Negating ${-half} within the same signed width would overflow.</div>`:''}${renderNegationComparison(mag,w)}${labFooter()}</section><aside class="side-panels"><section class="card insight"><h3>${ic('bulb')} Read the sign bit</h3><p>The leftmost place is worth <strong>−${half}</strong>. The other places keep their usual positive values.</p><div class="mini-rule"><span>Sign bit 0</span><strong>≥ 0</strong></div><div class="mini-rule"><span>Sign bit 1</span><strong>&lt; 0</strong></div><div class="mini-rule"><span>Minimum</span><strong>${-half}</strong></div><div class="mini-rule"><span>Maximum</span><strong>${half-1}</strong></div><div class="info-note">Range for n bits:<br><span class="mono">−2<sup>n−1</sup> to 2<sup>n−1</sup> − 1</span></div></section><section class="card insight"><h3>Same pattern, different meaning</h3><p class="mono">${group(bits(n,w))}</p><div class="mini-rule"><span>As unsigned binary</span><strong>${n}</strong></div><div class="mini-rule"><span>As two’s complement</span><strong>${v}</strong></div><div class="info-note blue">Two’s complement has <strong>one zero</strong>. It is not sign-and-magnitude notation.</div></section></aside></div>`;
}
const PRACTICE_MODES={binary:[['mixed','Mixed practice'],['b2d','Binary → denary'],['d2b','Denary → binary'],['brange','Unsigned range']],hex:[['mixed','Mixed practice'],['h2d','Hex → denary'],['d2h','Denary → hex'],['h2b','Hex → binary'],['b2h','Binary → hex']],operations:[['mixed','Mixed 7-bit operations'],['add','Addition & overflow'],['multiply','Multiply by 2 / 4 / 8 using SHIFT'],['divide','Divide by 2 / 4 / 8 using SHIFT'],['shiftloss','Extension: overflow & remainders'],['shift','Extension: logical & arithmetic shifts']],twos:[['negate-invert','Method 1 · Invert all bits, then add 1'],['negate-shortcut','Method 2 · Keep through the first 1, then invert'],['mixed','Mixed practice'],['encode','Denary → two’s complement'],['decode','Two’s complement → denary'],['trange','Signed range']]};
function newPractice(topic=state.topic){
 if(topic==='twos'&&state.modes.twos.startsWith('negate-')){newNegationDrill(state.modes.twos);return;}
 const old=state.practice[topic]?.q?.signature;
 let q=makeQuestion(topic,state.width,state.modes[topic]);
 for(let i=0;i<12&&q.signature===old;i++)q=makeQuestion(topic,state.width,state.modes[topic]);
 state.practice[topic]={q,answer:'',tries:0,hint:false,revealed:false,solved:false,counted:false,feedback:null,error:null};
}
function countPractice(p){if(!p.counted){state.stats[p.q.topic].attempted++;p.counted=true;}}
function checkPractice(){const p=state.practice[state.topic];if(!p||p.solved||p.revealed)return;
 const value=normalise(p.q,p.answer);
 if(value.error){p.error=value.error;paint('practice-answer');announce(value.error);return;}
 p.error=null;p.tries++;countPractice(p);
 if(value.value===p.q.answer){p.solved=true;state.stats[state.topic].solved++;
  if(p.tries===1&&!p.hint)state.stats[state.topic].first++;
  p.feedback={kind:'correct',title:'Correct. Well done.',body:p.tries===1&&!p.hint?'Solved independently on your first try. Read the method below, then take the next question.':'You got there. Review the method below to strengthen your next attempt.'};
 }else p.feedback={kind:'wrong',title:'Not quite — try again.',body:p.q.answerType==='binary'?'Check the bit order, the register width and any carry or sign bit. Your valid attempt has been recorded.':p.q.answerType==='hex'?'Check each nibble or hexadecimal place value. A–F represent 10–15.':p.q.answerType==='denary'?'Check the place values and whether the question says unsigned or two’s complement.':'Re-read the question and check the definition. You may try again.'};
 save();paint(p.solved?'practice-next':'practice-answer');announce(p.feedback.title);
}
function revealPractice(){const p=state.practice[state.topic];if(p.solved||p.revealed)return;p.revealed=true;countPractice(p);state.stats[state.topic].revealed++;

function buildQuizQuestions(topics,count,w){
 const order=shuffled(Array.from({length:count},(_,i)=>topics[i%topics.length])),seen=new Set(),counter=Object.fromEntries(topics.map(t=>[t,0]));
 const types={binary:['b2d','d2b','brange'],hex:['h2b','b2h','h2d','d2h'],operations:['add','multiply','divide','shiftloss','shift'],twos:['negate1','negate2','encode','decode','trange']};
 return order.map(topic=>{
  const i=counter[topic]++,forceType=types[topic][i%types[topic].length];let q;
  for(let j=0;j<80;j++){
   q=(i===4&&j<8)?conceptualQuestion(topic,w):makeQuestion(topic,w,'mixed',j<40?forceType:null);
   if(!seen.has(q.signature))break;
  }
  seen.add(q.signature);return q;
 });
}

}

function countQuizAnswered(q=state.quiz){return q.responses.filter(r=>r.submitted).length;}

 if(q.mode==='revision'&&r.submitted)return true;
 const v=normalise(question,r.value);
 if(v.error){if(showError){r.error=v.error;paint('quiz-answer');announce(v.error);}return false;}
 r.error=null;r.submitted=true;r.correct=v.value===question.answer;save();return true;

function setWidth(w){
 if(['operations','twos'].includes(state.topic)){
  if(state.tab!=='explore'||!LEARN_ARITH_WIDTHS.includes(w)||w===state.arithmeticLearnWidth)return;
  const previous=state.arithmeticLearnWidth;
  const shiftValue=state.shiftKind==='arithmetic'?signed(state.shiftInitial,previous):state.shiftInitial;
  state.arithmeticLearnWidth=w;
  state.addA=wrap(state.addA,w);state.addB=wrap(state.addB,w);state.addStep=0;
  // Keep signed values when widening; narrowing retains the low stored bits.
  state.shiftInitial=wrap(shiftValue,w);
  state.twosValue=signed(wrap(state.twosValue,w),w);
  state.shiftAmount=Math.max(1,Math.min(w-1,state.shiftAmount));
  state.shiftDone=0;state.lastShiftAnimated=false;state.lastShiftSignature=null;
  save();paint('bit-width');announce(`Using ${w}-bit registers. Calculations restart from the first step.`);
  return;
 }
 if(!WIDTHS.includes(w))return;
 state.width=w;state.binaryValue=wrap(state.binaryValue,w);state.hexValue=wrap(state.hexValue,w);
 delete state.practice.binary;delete state.practice.hex;save();paint('bit-width');
}
function validateIntegerInput(el,min,max){const raw=el.value.trim();if(!/^-?\d+$/.test(raw)||!Number.isInteger(Number(raw))||Number(raw)<min||Number(raw)>max){el.setAttribute('aria-invalid','true');announce(`Enter a whole number from ${min} to ${max}.`);return null;}el.removeAttribute('aria-invalid');return Number(raw);}

function newAdditionExample(){
 const before=state.addA+':'+state.addB,max=2**state.arithmeticLearnWidth-1;
 let a,b;do{a=rand(1,max);b=rand(1,max);}while(a+':'+b===before);
 state.addA=a;state.addB=b;state.addStep=0;
}
function newShiftExample(randomAmount=true){
 const w=state.arithmeticLearnWidth,max=2**w-1,half=2**(w-1);
 state.shiftAmount=Math.max(1,Math.min(w-1,state.shiftAmount));
 let signature='';
 for(let attempt=0;attempt<40;attempt++){
  if(randomAmount)state.shiftAmount=rand(1,3);
  const factor=2**state.shiftAmount,kind=state.shiftKind,challenge=state.shiftCase==='challenge';
  let v;
  if(kind==='left')v=challenge?rand(Math.floor(max/factor)+1,max):rand(1,Math.floor(max/factor));
  else if(kind==='right')v=challenge?rand(0,Math.floor(max/factor)-1)*factor+rand(1,factor-1):rand(1,Math.floor(max/factor))*factor;
  else if(challenge)v=-(rand(0,Math.max(0,Math.floor(half/factor)-1))*factor+rand(1,factor-1));
  else {const negative=rand(0,1)===1||factor===half;v=rand(1,Math.floor((negative?half:half-1)/factor))*factor*(negative?-1:1);}
  state.shiftInitial=wrap(v,w);
  signature=[w,kind,state.shiftAmount,state.shiftInitial,state.shiftCase].join(':');
  if(signature!==state.lastShiftSignature)break;
 }
 state.lastShiftSignature=signature;state.shiftDone=0;state.lastShiftAnimated=false;
}
function negateByShortcut(s){
 if(!/^[01]+$/.test(s))throw new TypeError('A non-empty binary string is required.');
 const pivot=s.lastIndexOf('1');
 if(pivot===-1)return s;
 return [...s.slice(0,pivot)].map(b=>b==='1'?'0':'1').join('')+s.slice(pivot);
}
function quizWidthSummary(questions){const widths=[...new Set(questions.map(q=>q.width))].sort((a,b)=>a-b);return widths.join(' / ')+'-bit questions';}
function miniRegister(s,pivot=-1,label=''){

}
function renderNegationComparison(n,w=ARITH_WIDTH){
 if(n===0)return '<div class="info-note blue">Zero stays all zeros after negation. There is no rightmost 1 to find; both +0 and −0 use the same pattern.</div>';
 if(n>=2**(w-1))return '';
 const s=bits(n,w),inv=[...s].map(b=>b==='1'?'0':'1').join(''),out=bits(-n,w),pivot=s.lastIndexOf('1');
 return `<section class="method-comparison"><hr class="panel-divider"><div class="section-kicker">POSITIVE → NEGATIVE · TWO EQUIVALENT METHODS</div><h3>Negate +${n} to make −${n}</h3><p class="small muted">This changes the value’s sign. Simply encoding +${n} is a different task.</p><div class="method-pair"><div class="method-box"><span class="badge navy">METHOD 1</span><h4>Invert every bit, then add 1</h4><div class="method-row"><span>+${n}</span>${miniRegister(s)}</div><div class="method-row"><span>Invert</span>${miniRegister(inv)}</div><div class="method-row final-row"><span>Add 1</span>${miniRegister(out)}</div></div><div class="method-box"><span class="badge gold">METHOD 2</span><h4>Keep through the first 1; invert the left</h4><div class="method-row"><span>Scan ←</span>${miniRegister(s,pivot)}</div><p class="tiny muted">Start on the right. Keep the first 1 and every 0 to its right (gold). Invert only the bits to its left.</p><div class="method-row final-row"><span>Result</span>${miniRegister(negateByShortcut(s),pivot)}</div></div></div><div class="equation">Both methods → <strong>${out}</strong>₂ = <strong>−${n}</strong>₁₀<br>Check: ${weightedSum(wrap(-n,w),w,true)} = −${n}</div></section>`;
}
const NEGATION_METHODS={

 'negate-shortcut':{label:'Method 2 · Keep through the first 1',stages:['Write the positive value','Find the first 1 from the right','Keep the suffix; invert the left'],hints:['Use exactly seven bits. A positive signed value between 1 and 63 begins with 0.','Start at the rightmost position. Skip zeros until you reach a 1. Click that 1, not the first 1 from the left.','The first 1 from the right and all bits after it stay unchanged. Change each bit to the left: 0 ↔ 1. Do not add 1 afterwards.']}

 if(!NEGATION_METHODS[method])method='negate-invert';
 const previous=state.negationDrill?.value;
 if(value===null){do{value=rand(1,63);}while(value===previous);}
 if(!Number.isInteger(value)||value<1||value>63)throw new RangeError('A positive signed 7-bit value from 1 to 63 is required.');
 state.negationDrill={method,value,stage:0,entries:['???????','???????','???????'],valid:[false,false,false],pivotSelection:-1,mistakes:0,counted:false,assisted,stageHint:false,solved:false,revealed:false,feedback:null};
}

function checkNegation(){

 }else{

 }

`;
  document.head.appendChild(style);
  const selectedRoute = () => Object.keys(routes).find(slug => {
    const r=routes[slug];return state.tab==='practice' && state.topic===r.topic && state.modes[r.topic]===r.mode;
  });
  const validHash = () => {
    const slug=location.hash.slice(1);return Object.hasOwn(routes,slug)?slug:null;
  };
  function setHash(slug) {
    try {
      const suffix=slug?'#'+slug:'';
      if(location.hash!==suffix)history.replaceState(null,'',location.pathname+location.search+suffix);
    } catch (_) { /* Exercise navigation also works when local-file history is unavailable. */ }
  }
  function syncHash() {
    const slug=selectedRoute();
    if(slug)setHash(slug);else if(validHash())setHash(null);
  }
  function selectExercise(slug, render=true) {
    if(!Object.hasOwn(routes,slug))return false;
    const r=routes[slug],wasMode=state.modes[r.topic];
    state.topic=r.topic;state.tab='practice';state.modes[r.topic]=r.mode;
    const isNegation=r.mode.startsWith('negate-');
    const existing=isNegation?state.negationDrill?.method===r.mode:state.practice[r.topic]?.q?.type===r.mode;
    if(wasMode!==r.mode||!existing)newPractice(r.topic);
    setHash(slug);
    if(render){paint('exercise-'+slug);document.getElementById('exercise-menu')?.scrollIntoView({block:'start',behavior:'instant'});}
    return true;
  }
  function menu() {
    const entries=Object.entries(routes).filter(([,r])=>r.topic===state.topic);
    if(!entries.length)return '';
    const active=selectedRoute();
    return `<section class="ex-menu" id="exercise-menu" aria-labelledby="exercise-menu-title"><div class="ex-menu-heading"><h2 id="exercise-menu-title">Choose a practice exercise</h2><p>Click an exercise to open its own random question.</p></div><div class="ex-menu-grid ${entries.length===3?'ex-three':''}">${entries.map(([slug,r])=>`<button type="button" id="exercise-${slug}" class="ex-tile ${r.featured?'ex-featured':''} ${active===slug?'ex-active':''}" data-action="open-exercise" data-exercise="${slug}" aria-pressed="${active===slug}"><span class="ex-state">${active===slug?'Current exercise':r.featured?'Extra exercise':'Practice'}</span><strong>${esc(r.title)}</strong><span class="ex-formula">${esc(r.formula)}</span><span class="ex-description">${esc(r.description)}</span></button>`).join('')}</div></section>`;
  }
  const oldTabs=labTabs;
  labTabs=function(){return oldTabs()+menu();};
  const oldNav=renderNav;
  renderNav=function(){
    oldNav();
    for(const slug of ['add-three','subtract-two']) {
      const r=routes[slug],parent=document.querySelector(`#navigation .nav-item[data-topic="${r.topic}"]`);
      if(parent)parent.insertAdjacentHTML('afterend',`<button type="button" class="nav-exercise ${selectedRoute()===slug?'ex-active':''}" data-action="open-exercise" data-exercise="${slug}" aria-label="Open ${esc(r.title)} exercise"><span class="ex-nav-arrow" aria-hidden="true">↳</span>${esc(r.title)}</button>`);
    }
  };
  actions['open-exercise']=el=>selectExercise(el.dataset.exercise);
  for(const name of ['nav','tab']) {
    const oldAction=actions[name];
    actions[name]=el=>{oldAction(el);syncHash();};
  }
  document.addEventListener('change',event=>{if(event.target.dataset.change==='practice-mode')syncHash();});
  window.addEventListener('hashchange',()=>{const slug=validHash();if(slug)selectExercise(slug);});
  const requested=validHash();if(requested)selectExercise(requested,false);
  TOPICS.operations.sub='Add 2 / 3 numbers & SHIFT';
  TOPICS.operations.desc='Add two numbers by columns; combine three numbers in two stages. Then multiply and divide using shifts.';
  TOPICS.twos.sub='Negation & subtract 2 numbers';
  window.RGSVLab.version='2.8';
  window.RGSVLab.openExercise=slug=>selectExercise(slug);
  window.RGSVLab.exerciseRoutes=Object.fromEntries(Object.entries(routes).map(([slug,r])=>[slug,{topic:r.topic,mode:r.mode,title:r.title}]));
  document.querySelector('.side-version').textContent='RGSV · DIGITAL LEARNING · V2.8';
}

installSequentialV25();installExerciseMenuV25();
newAdditionExample();newShiftExample();state.twosValue=-rand(1,2**(state.arithmeticLearnWidth-1)-1);
paint();
if(state.quiz&&!state.quiz.ended){announce('An unfinished quiz was restored. Open Quiz studio to continue.');}
})();
